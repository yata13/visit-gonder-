name: visit_gondar_admin
description: "Visit Gondar — Admin Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend — same Supabase project as tourist app
  supabase_flutter: ^2.8.4
  flutter_dotenv: ^5.2.1

  # State management
  flutter_riverpod: ^2.6.1

  # UI
  flutter_map: ^7.0.2            # interactive map for safety screen
  latlong2: ^0.9.1               # LatLng coordinates
  cached_network_image: ^3.4.1   # show hotel/site images
  shimmer: ^3.0.0                # loading skeletons
  intl: ^0.20.2                  # date formatting
  file_picker: ^8.3.7            # upload images

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
